[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doculens"
version = "0.1.0"
description = "Classical DIP preprocessing pipeline for OCR of Indian insurance claim documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "opencv-python>=4.9",
  "numpy>=1.26",
  "pillow>=10.2",
  "pytesseract>=0.3.10",
  "faker>=24.0",
  "jiwer>=3.0",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
doculens = "doculens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "T20", "D"]
ignore = ["D107", "D205", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
"src/doculens/cli.py" = ["T20"]
"src/doculens/eval/report.py" = ["T20"]
"scripts/*" = ["T20"]
